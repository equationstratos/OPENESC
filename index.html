<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEBUG — OpenESC</title>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.163.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/" } }</script>
</head>
<body style="background:#000; color:#fff; margin:0;">
<div id="status" style="position:fixed; top:10px; left:10px; background:black; padding:10px;">Chargement...</div>
<div id="viewport" style="width:100vw; height:100vh;"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const ASSETS = './assets/dexi-esc-explorer';
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.getElementById('viewport').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 0, 0.5);

scene.add(new THREE.AmbientLight(0xffffff, 2));

async function debugLoad() {
    const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
    const status = document.getElementById('status');
    
    try {
        console.log("Tentative de chargement de :", ASSETS);
        
        // Tester le chargement des deux fichiers
        const board = await loader.loadAsync(`${ASSETS}/esc-board.glb`);
        console.log("✅ esc-board.glb chargé avec succès");
        scene.add(board.scene);
        
        const parts = await loader.loadAsync(`${ASSETS}/esc-parts.glb`);
        console.log("✅ esc-parts.glb chargé avec succès");
        
        let count = 0;
        parts.scene.traverse(node => {
            if (node.isMesh) {
                node.visible = true; // Forcer la visibilité
                count++;
            }
        });
        
        scene.add(parts.scene);
        status.textContent = `Succès ! Pièces chargées : ${count}`;
        console.log("Nombre de meshes trouvés dans parts:", count);
        
    } catch (e) {
        status.textContent = "ERREUR : Voir console (F12)";
        console.error("Erreur de chargement complète :", e);
    }
}

debugLoad();

function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
animate();
</script>
</body>
</html>
