<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Build an ESC — Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --cyan:#00A7E1; --ok:#37e0a0; --ink:#eaf4fb; --dim:#9fc0d6; }
  body{margin:0;height:100vh;background:#0b1622;color:var(--ink);font-family:Inter,sans-serif;overflow:hidden}
  canvas{display:block;touch-action:none}
  #top{position:fixed;top:0;left:0;right:0;z-index:5;padding:14px;background:linear-gradient(180deg,#0b1622f2,#0b162200)}
  #card{position:fixed;left:18px;bottom:18px;z-index:6;width:400px;background:#0e2236f6;border-left:4px solid var(--cyan);padding:20px;border-radius:18px;box-shadow:0 10px 30px #000}
  #card h3{font-size:1.2rem;margin-bottom:8px}
  #card p{font-size:0.9rem;color:var(--dim);line-height:1.5}
  .btn{padding:10px 20px;background:#16304a;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:700}
  #ctl{position:fixed;right:18px;bottom:18px;z-index:6;display:flex;gap:10px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.163.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/" } }</script>
</head>
<body>
  <div id="top"><h2>Build an ESC</h2></div>
  <div id="card">
    <h3 id="cTitle">Chargement...</h3>
    <div id="cWhat" style="color:var(--cyan); font-weight:bold; margin-bottom:10px"></div>
    <p id="cBlurb"></p>
  </div>
  <div id="ctl">
    <button class="btn" id="btnBack">← Back</button>
    <button class="btn" id="btnNext">Next →</button>
  </div>
  <div id="viewport"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const ASSETS = './assets/dexi-esc-explorer';
const STEPS = [
  {title:'Six switches', what:'MOSFETs', blurb:'Les MOSFETs forment l\'étage de puissance.', refs:(m,ch)=>ch.fets},
  {title:'Capacitors', what:'Filtering', blurb:'Condensateurs de découplage.', refs:(m,ch)=>ch.loop_caps},
  {title:'Shunts', what:'Current sensing', blurb:'Mesure du courant.', refs:(m,ch)=>[...m.shared.shunts, m.shared.ina]},
  {title:'Drivers', what:'Gate drivers', blurb:'Pilotes de grille.', refs:(m,ch)=>[ch.driver,...ch.bootstrap,...(ch.gate_res||[])]},
  {title:'MCU', what:'Brains', blurb:'Le microcontrôleur.', refs:(m,ch)=>[ch.mcu]},
  {title:'Regulation', what:'Power rails', blurb:'Conversion Buck/LDO.', refs:(m,ch)=>[m.shared.buck,m.shared.ldo]},
  {title:'Connectors', what:'Input/Output', blurb:'Entrées et protections.', refs:(m,ch)=>[m.shared.connector]},
  {title:'Full Assembly', what:'Ready to fly', blurb:'Carte assemblée.', refs:()=>null}
];

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.01, 50);
camera.position.set(0.1, 0.1, 0.1);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.getElementById('viewport').appendChild(renderer.domElement);
new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 1));

const ROOT = new THREE.Group(); scene.add(ROOT);
let nodes = new Map(), MAN = null, CH = null;

async function load() {
  const [mRes, bRes, pRes] = await Promise.all([
    fetch(`${ASSETS}/esc-manifest.json`),
    new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(`${ASSETS}/esc-board.glb`),
    new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(`${ASSETS}/esc-parts.glb`)
  ]);
  MAN = await mRes.json();
  CH = MAN.channels[0];
  ROOT.add(bRes.scene);
  ROOT.add(pRes.scene);
  pRes.scene.traverse(ch => { 
    if(ch.name) { 
        nodes.set(ch.name, ch); 
        ch.visible = false; 
    } 
  });
  updateStep(0);
}

function updateStep(idx) {
  const s = STEPS[idx];
  document.getElementById('cTitle').textContent = s.title;
  document.getElementById('cWhat').textContent = s.what;
  document.getElementById('cBlurb').textContent = s.blurb;

  const refs = s.refs ? s.refs(MAN, CH) : null;
  nodes.forEach(n => n.visible = (idx === 7));
  
  if (refs) {
    refs.forEach(r => {
      if(nodes.has(r)) {
        nodes.get(r).visible = true;
        gsap.fromTo(nodes.get(r).scale, {x:0,y:0,z:0}, {x:1,y:1,z:1, duration:0.5});
      } else {
        console.warn("Composant manquant dans le GLB :", r);
      }
    });
  }
}

document.getElementById('btnNext').onclick = () => { if(stepIndex < 7) updateStep(++stepIndex); };
load();
let stepIndex = 0;
function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
animate();
</script>
</body>
</html>
