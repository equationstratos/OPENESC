<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Build an ESC — DEXI Ground School</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --cyan:#00A7E1; --ok:#37e0a0; --warn:#ffb068; --ink:#eaf4fb; --dim:#9fc0d6; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1622;
    font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #viewport{width:100%;height:100%;position:relative}
  canvas{display:block;touch-action:none}
  
  /* UI Styles identiques à l'original */
  #top{position:fixed;top:0;left:0;right:0;z-index:5;padding:14px 18px;background:linear-gradient(180deg,#0b1622f2,#0b162200);pointer-events:none}
  #topInner{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto}
  #logo{flex:none;width:44px;height:44px;border-radius:12px;background:var(--cyan);color:#04222f;display:grid;place-items:center;font-size:22px;box-shadow:0 6px 18px #00a7e155}
  #ttl{flex:1;min-width:0}
  #ttl b{font-size:17px;font-weight:900;display:block;line-height:1.15}
  #ttl span{font-size:12.5px;color:var(--dim)}
  #prog{flex:none;text-align:right;font-size:12px;color:var(--dim);line-height:1.4}
  #prog b{color:var(--ink);font-size:16px;font-weight:900}
  #bar{max-width:1180px;margin:11px auto 0;height:6px;border-radius:4px;background:#16304a;overflow:hidden}
  #barFill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--ok));transition:width .5s cubic-bezier(.2,.9,.25,1)}

  #card{position:fixed;left:18px;bottom:18px;z-index:6;width:min(400px,calc(100vw - 36px));background:linear-gradient(180deg,#0e2236f6,#0a1825f6);border:1px solid #1c3950;border-radius:18px;padding:16px 18px 15px;box-shadow:0 16px 44px #0009;border-left:4px solid var(--cyan);max-height:80vh;overflow-y:auto}
  #card .ch{display:flex;align-items:flex-start;gap:11px}
  #card .em{font-size:26px;line-height:1.05}
  #card h3{margin:0;font-size:18.5px;font-weight:900;letter-spacing:-.015em;line-height:1.2}
  #card .what{font-size:13px;color:var(--cyan);font-weight:800;margin-top:3px}
  #card p{font-size:13.6px;color:#c4dced;line-height:1.55;margin:11px 0 0}
  
  #ctl{position:fixed;right:18px;bottom:18px;z-index:6;display:flex;gap:9px;align-items:center}
  .btn{border:1px solid #244863;background:#102a40e6;color:var(--ink);border-radius:11px;padding:12px 16px;font:800 13.5px Inter;cursor:pointer;transition:.12s;white-space:nowrap}
  .btn:hover:not(:disabled){border-color:var(--cyan);background:#13405c}
  .btn.pri{background:linear-gradient(180deg,#0d84b8,#0a6d99);border-color:#1ba0dc;color:#fff}
  
  #viewBtns{position:fixed;top:80px;right:18px;z-index:6;display:flex;gap:6px}
  #status{position:fixed;top:82px;left:50%;transform:translateX(-50%);z-index:5;font:800 12.5px Inter;color:#bfe0f2;background:#0e2438dd;border:1px solid #244863;border-radius:999px;padding:7px 16px;text-align:center}
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.163.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/" } }
</script>
</head>
<body>
  <div id="top"><div id="topInner">
    <div id="logo">⚡</div>
    <div id="ttl"><b>Build an ESC</b><span>One motor channel, one part at a time — then × 4</span></div>
    <div id="prog"><b id="pCount">1/8</b><br><span>build steps</span></div>
  </div><div id="bar"><div id="barFill"></div></div></div>
  <div id="status">Chargement des composants...</div>
  <div id="viewBtns">
    <button class="btn sm" id="btnIso">ISO</button>
    <button class="btn sm" id="btnFront">Front</button>
    <button class="btn sm" id="btnFlip">🔄 Flip</button>
  </div>
  <div id="card">
    <div class="ch"><span class="em" id="cEm">⚡</span><div><h3 id="cTitle"></h3><div class="what" id="cWhat"></div></div></div>
    <p id="cBlurb"></p>
    <div class="meta"><span class="chip" id="cStage"></span><span class="chip face" id="cFace"></span></div>
    <div class="refs" id="cRefs"></div>
  </div>
  <div id="viewport"></div>
  <div id="ctl">
    <button class="btn sm" id="btnReframe">🎯 Re-frame</button>
    <button class="btn" id="btnBack">← Back</button>
    <button class="btn pri" id="btnNext">Next →</button>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const ASSETS = './assets/dexi-esc-explorer';
const STEPS = [
  {id:'bridges', em:'🔀', stage:'Power', title:'Six switches', what:'MOSFETs', refs:(m,ch)=>[...m.channels.flatMap(c=>c.fets)], blurb:`MOSFETs installés.`},
  {id:'loop', em:'🧱', stage:'Power', title:'Capacitors', what:'Filtering', refs:(m,ch)=>[...m.channels.flatMap(c=>c.loop_caps)], blurb:`Condensateurs posés.`},
  {id:'sense', em:'🚦', stage:'Measure', title:'Shunts', what:'Current sensing', refs:(m,ch)=>[...m.shared.shunts, m.shared.ina], blurb:`Shunts et amplis.`},
  {id:'driver', em:'💪', stage:'Control', title:'Drivers', what:'Gate drivers', refs:(m,ch)=>[...m.channels.flatMap(c=>[c.driver,...c.bootstrap])], blurb:`Pilotes de grille.`},
  {id:'mcu', em:'🧠', stage:'Control', title:'MCU', what:'Brains', refs:(m,ch)=>[...m.channels.flatMap(c=>[c.mcu])], blurb:`Microcontrôleurs.`},
  {id:'supply', em:'🪣', stage:'Supply', title:'Buck/LDO', what:'Regulation', refs:(m,ch)=>[m.shared.buck,m.shared.ldo], blurb:`Régulateurs.`},
  {id:'input', em:'🚪', stage:'Input', title:'Front door', what:'Connectors', refs:(m,ch)=>[m.shared.connector], blurb:`Connecteurs.`},
  {id:'tile', em:'🧩', stage:'Finish', title:'Complete', what:'Full assembly', refs:()=>null, blurb:`Carte terminée.`}
];

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('viewport').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1622);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.001, 50);
camera.position.set(0.2, 0.2, 0.2);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
scene.add(new THREE.DirectionalLight(0xffffff, 1));

let MAN=null, CH=null;
const ROOT = new THREE.Group(); scene.add(ROOT);
const nodes = new Map();
let stepIndex = 0;

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);

async function load() {
  try {
    const res = await fetch(`${ASSETS}/esc-manifest.json`);
    MAN = await res.json();
    CH = MAN.channels[0];
    const [bRes, pRes] = await Promise.all([
      loader.loadAsync(`${ASSETS}/esc-board.glb`),
      loader.loadAsync(`${ASSETS}/esc-parts.glb`)
    ]);
    ROOT.add(bRes.scene);
    ROOT.add(pRes.scene);
    pRes.scene.traverse(ch => { if(ch.name) nodes.set(ch.name, ch); ch.visible = false; });
    document.getElementById('status').style.display = 'none';
    showStep(0);
  } catch(e) { console.error(e); }
}
load();

function showStep(idx) {
  stepIndex = idx;
  const step = STEPS[idx];
  const refs = step.refs ? step.refs(MAN, CH) : null;
  document.getElementById('pCount').textContent = `${idx + 1}/8`;
  document.getElementById('cTitle').textContent = step.title;
  if (refs) {
    nodes.forEach(n => n.visible = false);
    refs.forEach(r => {
      if(nodes.has(r)) nodes.get(r).visible = true;
      else console.warn("Composant introuvable:", r);
    });
  } else { nodes.forEach(n => n.visible = true); }
}

document.getElementById('btnNext').onclick = () => { if(stepIndex < 7) showStep(stepIndex + 1); };
animate();
function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
</script>
</body>
</html>
