<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Build an ESC — DEXI Ground School</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --cyan:#00A7E1; --ok:#37e0a0; --warn:#ffb068; --ink:#eaf4fb; --dim:#9fc0d6; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1622;
    font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #viewport{width:100%;height:100%;position:relative}
  canvas{display:block;touch-action:none}

  /* top bar */
  #top{position:fixed;top:0;left:0;right:0;z-index:5;padding:14px 18px;
    background:linear-gradient(180deg,#0b1622f2,#0b162200);pointer-events:none}
  #topInner{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto}
  #logo{flex:none;width:44px;height:44px;border-radius:12px;background:var(--cyan);color:#04222f;
    display:grid;place-items:center;font-size:22px;box-shadow:0 6px 18px #00a7e155}
  #ttl{flex:1;min-width:0}
  #ttl b{font-size:17px;font-weight:900;display:block;line-height:1.15}
  #ttl span{font-size:12.5px;color:var(--dim)}
  #prog{flex:none;text-align:right;font-size:12px;color:var(--dim);line-height:1.4}
  #prog b{color:var(--ink);font-size:16px;font-weight:900}
  #bar{max-width:1180px;margin:11px auto 0;height:6px;border-radius:4px;background:#16304a;overflow:hidden}
  #barFill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--ok));transition:width .5s cubic-bezier(.2,.9,.25,1)}

  /* teaching card */
  #card{position:fixed;left:18px;bottom:18px;z-index:6;width:min(400px,calc(100vw - 36px));
    background:linear-gradient(180deg,#0e2236f6,#0a1825f6);border:1px solid #1c3950;border-radius:18px;
    padding:16px 18px 15px;box-shadow:0 16px 44px #0009;border-left:4px solid var(--cyan);max-height:80vh;overflow-y:auto}
  #card .ch{display:flex;align-items:flex-start;gap:11px}
  #card .em{font-size:26px;line-height:1.05}
  #card h3{margin:0;font-size:18.5px;font-weight:900;letter-spacing:-.015em;line-height:1.2}
  #card .what{font-size:13px;color:var(--cyan);font-weight:800;margin-top:3px}
  #card p{font-size:13.6px;color:#c4dced;line-height:1.55;margin:11px 0 0}
  #card p b{color:#fff;font-weight:800}
  #card .meta{margin-top:12px;padding-top:10px;border-top:1px solid #16324a;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{font:800 10.5px Inter;letter-spacing:.04em;text-transform:uppercase;
    border-radius:999px;padding:4px 9px;background:#123049;color:#8fc2e0;border:1px solid #1d4362}
  .chip.face{color:#ffd9a8;border-color:#54402a;background:#2a2015}
  #card .refs{margin-top:8px;font:700 11px ui-monospace,Menlo,monospace;color:#6f96b1;line-height:1.5;word-break:break-word}

  /* controls */
  #ctl{position:fixed;right:18px;bottom:18px;z-index:6;display:flex;gap:9px;align-items:center}
  .btn{border:1px solid #244863;background:#102a40e6;color:var(--ink);border-radius:11px;
    padding:12px 16px;font:800 13.5px Inter;cursor:pointer;transition:.12s;white-space:nowrap}
  .btn:hover:not(:disabled){border-color:var(--cyan);background:#13405c}
  .btn.pri{background:linear-gradient(180deg,#0d84b8,#0a6d99);border-color:#1ba0dc;color:#fff}
  .btn.sm{padding:10px 12px;font-size:13px}

  /* view buttons top right */
  #viewBtns{position:fixed;top:80px;right:18px;z-index:6;display:flex;gap:6px}
  #status{position:fixed;top:82px;left:50%;transform:translateX(-50%);z-index:5;
    font:800 12.5px Inter;color:#bfe0f2;background:#0e2438dd;border:1px solid #244863;border-radius:999px;
    padding:7px 16px;text-align:center}
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.163.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/" } }
</script>
</head>
<body>
  <div id="top"><div id="topInner">
    <div id="logo">⚡</div>
    <div id="ttl"><b>Build an ESC</b><span>One motor channel, one part at a time — then × 4</span></div>
    <div id="prog"><b id="pCount">1/8</b><br><span>build steps</span></div>
  </div><div id="bar"><div id="barFill"></div></div></div>

  <div id="status">Chargement des composants OpenESC...</div>

  <div id="viewBtns">
    <button class="btn sm" id="btnIso">ISO</button>
    <button class="btn sm" id="btnFront">Front</button>
    <button class="btn sm" id="btnFlip">🔄 Flip</button>
  </div>

  <div id="card">
    <div class="ch"><span class="em" id="cEm">⚡</span><div><h3 id="cTitle"></h3><div class="what" id="cWhat"></div></div></div>
    <p id="cBlurb"></p>
    <div class="meta"><span class="chip" id="cStage"></span><span class="chip face" id="cFace"></span></div>
    <div class="refs" id="cRefs"></div>
  </div>

  <div id="viewport"></div>

  <div id="ctl">
    <button class="btn sm" id="btnReframe">🎯 Re-frame</button>
    <button class="btn" id="btnBack">← Back</button>
    <button class="btn pri" id="btnNext">Next →</button>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const ASSETS = './assets/dexi-esc-explorer';

const STEPS = [
  {
    id:'bridges', em:'🔀', stage:'Power stage',
    title:'Six switches, in three pairs (M1 to M4)',
    what:'The MOSFETs — repeated for each motor channel',
    refs:(m,ch)=>[...m.channels.flatMap(c => c.fets)],
    blurb:`Un ESC 4-en-1 répète la même structure de puissance pour chaque moteur. Les transistors MOSFET s'installent tour à tour sur les 4 quadrants de la carte pour former les trois phases de chaque canal.`,
  },
  {
    id:'loop', em:'🧱', stage:'Power stage',
    title:'Ceramics, packed in tight',
    what:'Local capacitors across all channels',
    refs:(m,ch)=>[...m.channels.flatMap(c => c.loop_caps)],
    blurb:`Chaque canal de commutation embarque ses propres condensateurs de découplage au plus près des MOSFETs pour étouffer instantanément les pics de tension.`,
  },
  {
    id:'sense', em:'🚦', stage:'Measurement',
    title:'The toll booth',
    what:'Shunt resistor + current-sense amplifier',
    refs:(m,ch)=>[...m.shared.shunts, m.shared.ina],
    blurb:`Le système de mesure centralisé surveille le flux de courant global traversant l'alimentation principale via les shunts et l'amplificateur dédié.`,
  },
  {
    id:'driver', em:'💪', stage:'Control',
    title:'The muscle chip',
    what:'Gate drivers & bootstrap circuits',
    refs:(m,ch)=>[...m.channels.flatMap(c => [...c.driver, ...c.bootstrap, ...c.gate_res].filter(Boolean))],
    blurb:`Chaque quadrant possède son propre pilote de grille et ses composants associés pour saturer et commuter les transistors à ultra-haute fréquence.`,
  },
  {
    id:'mcu', em:'🧠', stage:'Control',
    title:'The brains — 4 independent MCUs',
    what:'Microcontrollers running open-source AM32',
    refs:(m,ch)=>[...m.channels.flatMap(c => [c.mcu, ...c.mcu_support])],
    blurb:`Contrairement aux cartes unifiées classiques, cet OpenESC intègre <b>un microcontrôleur dédié par canal</b> pour gérer la commutation sans capteur en parallèle.`,
  },
  {
    id:'supply', em:'🪣', stage:'Supply',
    title:'Stepping the battery down — twice',
    what:'Buck converter → 10 V, then a regulator → 3.3 V',
    refs:(m,ch)=>[m.shared.buck, m.shared.inductor, m.shared.ldo, ...m.shared.supply_support],
    blurb:`La section d'alimentation partagée abaisse la tension de la batterie pour alimenter d'une part les drivers de grille et d'autre part la logique de calcul.`,
  },
  {
    id:'input', em:'🚪', stage:'Input',
    title:'The front door',
    what:'Battery pads, signal connector, surge protection',
    refs:(m,ch)=>[m.shared.connector, ...m.shared.tvs, ...(m.placement.U3?['U3']:[])],
    blurb:`Les connexions principales reçoivent l'accu de propulsion, tandis que les diodes TVS protègent l'ensemble contre les transitoires et pics parasites.`,
  },
  {
    id:'tile', em:'🧩', stage:'The 4-in-1',
    title:'Now do that four times',
    what:'Complete assembled 4-in-1 layout',
    refs:()=>null,
    blurb:`Tous les composants des 4 quadrants sont désormais en place, unifiant puissance et contrôle sur les deux faces du circuit imprimé.`,
  },
];

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.getElementById('viewport').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1622);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.001, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;

scene.add(new THREE.HemisphereLight(0xdcefff, 0x2f3f52, 0.55));
scene.add(new THREE.AmbientLight(0xffffff, 0.16));
const key = new THREE.DirectionalLight(0xfff4e2, 1.5);
key.castShadow = true; scene.add(key);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

let MAN = null, CH = null;
const ROOT = new THREE.Group(); scene.add(ROOT);
let boardRoot = null, partsRoot = null;
const boardMats = [];
const nodes = new Map();
let stepIndex = 0;
let flipped = false;

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);

async function loadESC() {
  try {
    const res = await fetch(`${ASSETS}/esc-manifest.json`);
    MAN = await res.json();
    CH = MAN.channels[0];

    const [bRes, pRes] = await Promise.all([
      loader.loadAsync(`${ASSETS}/esc-board.glb`),
      loader.loadAsync(`${ASSETS}/esc-parts.glb`)
    ]);

    boardRoot = bRes.scene;
    boardRoot.traverse(ch => {
      if (ch.isMesh) {
        if (ch.material) {
          ch.material.transparent = true;
          ch.material.opacity = 0.34;
          boardMats.push(ch.material);
        }
      }
    });
    ROOT.add(boardRoot);

    partsRoot = pRes.scene;
    ROOT.add(partsRoot);

    partsRoot.traverse(ch => {
      if (ch.name) {
        nodes.set(ch.name, ch);
        ch.visible = false;
      }
    });

    const box = new THREE.Box3().setFromObject(boardRoot);
    const centre = box.getCenter(new THREE.Vector3());
    boardRoot.position.sub(centre);
    partsRoot.position.sub(centre);
    controls.target.set(0, 0, 0);
    camera.position.set(0, 0.12, 0.18);

    document.getElementById('status').style.display = 'none';
    showStep(0);
  } catch (err) {
    document.getElementById('status').textContent = "Erreur chargement: " + err.message;
    console.error(err);
  }
}

loadESC();

function showStep(idx) {
  stepIndex = idx;
  const step = STEPS[idx];
  const refs = step.refs ? step.refs(MAN, CH) : null;

  document.getElementById('pCount').textContent = `${idx + 1}/8`;
  document.getElementById('barFill').style.width = `${((idx + 1) / 8) * 100}%`;
  document.getElementById('cEm').textContent = step.em;
  document.getElementById('cTitle').textContent = step.title;
  document.getElementById('cWhat').textContent = step.what;
  document.getElementById('cBlurb').innerHTML = step.blurb;
  document.getElementById('cStage').textContent = step.stage;
  document.getElementById('cFace').textContent = flipped ? 'Bottom face' : 'Top face';
  document.getElementById('cRefs').textContent = refs ? `on the board: ${refs.join(' ')}` : 'Tous les composants assemblés (4 canaux complets)';

  const op = (idx === STEPS.length - 1) ? 1.0 : 0.34;
  boardMats.forEach(m => m.opacity = op);

  if (idx === STEPS.length - 1) {
    nodes.forEach(node => { node.visible = true; });
  } else {
    nodes.forEach(node => { node.visible = false; });
    if (refs) {
      refs.forEach(ref => {
        const node = nodes.get(ref);
        if (node) node.visible = true;
      });
    }
  }

  document.getElementById('btnBack').disabled = (idx === 0);
  document.getElementById('btnNext').textContent = (idx === STEPS.length - 1) ? 'Finish 🏆' : 'Next →';
}

document.getElementById('btnNext').onclick = () => {
  if (stepIndex < STEPS.length - 1) showStep(stepIndex + 1);
  else location.reload();
};

document.getElementById('btnBack').onclick = () => {
  if (stepIndex > 0) showStep(stepIndex - 1);
};

document.getElementById('btnIso').onclick = () => {
  camera.position.set(0, 0.12, 0.18);
  controls.target.set(0, 0, 0);
};

document.getElementById('btnFront').onclick = () => {
  camera.position.set(0, 0, 0.22);
  controls.target.set(0, 0, 0);
};

document.getElementById('btnFlip').onclick = () => {
  flipped = !flipped;
  camera.position.y = flipped ? -0.15 : 0.15;
  controls.target.set(0, 0, 0);
};

document.getElementById('btnReframe').onclick = () => {
  camera.position.set(0, 0.12, 0.18);
  controls.target.set(0, 0, 0);
};

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
